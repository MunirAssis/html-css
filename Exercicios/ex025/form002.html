<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
         <!--para dados sensiveis é importante o method="post"-->
        <p>
            <label for="iusu">Usuário</label>
            <input type="text" name="usuario" id="iusuario" required minlength="5" maxlength="10" placeholder="Nome do Usuário" autocomplete="username">
        </p>
        <!--para o banco de dados é importante instanciarmos um numero minimo e maximo de caracteres para a senha e usuario!(usando minlength e maxlength)-->
        <p>
            <label for="isenha">Senha</label>
            <input type="password" name="sen" id="isenha" required minlength="8" maxlength="16" placeholder="Minimo de 8 caracteres" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
