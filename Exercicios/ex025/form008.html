<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="in1"> Numero 1</label>
            <input type="number" name="number" id="in1" min="1" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value) ">
        </p>
        
        <p>
            <label for="in2"> Numero 2</label>
            <input type="number" name="number" id="in2" min="1" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value) ">
        </p>
        
        <p>
            <label for="isoma"> Soma </label> 
            <output name="soma" id="isoma">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Resetar">
        </p>
    </form>
</body>
</html>
