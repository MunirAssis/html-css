<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fomularios</title>
</head>
<body>
    <h1>teste de formularion</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="10" placeholder="Nome Completo" autocomplete="name"> <!--lembrando: placeholder serve para inserir uma mensagem no input-->
        </p>

        <p>
            <label for="imedia">Media</label>
            <input type="number" name="media" id="imedia" min="1" max="10" step="0.1" required>
        </p>

        <p>
            <label for="imes">Mes</label>
            <input type="month" name="mes" id="imes" value="2026-11"> <!-- para instituir tipo usamos o "type e para um valor inicial "value-->
        </p>

        <p>
            <label for="idia">Data da prova</label>
            <input type="date" name="dia" id="idia" value="2026-11-05"><!--quando o type for "date colocar a data ao contrario -->
        </p>

        <p>
            <label for="ihora"> Horario de realisação da prova</label>
            <input type="time" name="hora" id="ihora" value="11:00">
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
