<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        table{
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        .destaque {
            background-color: lightgray;
        }

    </style>
</head>
<body>

    <table>
        <colgroup>
            <col class="destaque" >
            <col class="sexo">
            <col class="destaque">
            <col class="profissao">
        </colgroup>

        <tr style="background-color: gray;">
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <th>gabi</th>

            <th>18</th>
            <th>Biomedica</th>
        </tr>
        <tr class="destaque">
            <th>gabi</th>
            <th>F</th>
            <th>18</th>
            <th>Biomedica</th>
        </tr>
        <tr>
            <th>gabi</th>
            <th>F</th>
            <th>18</th>
            <th>Biomedica</th>
        </tr>
        <tr class="destaque">
            <th>gabi</th>
            <th>F</th>
            <th>18</th>
            <th>Biomedica</th>
        </tr>

    </table>
</body>
</html>
